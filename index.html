<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Link RTS</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body {
    margin:0; width:100%; height:100%; overflow:hidden;
    background:#101418;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    user-select:none;
  }
  #game { position:fixed; inset:0; width:100vw; height:100vh; display:block; background:#101418; }
  #help {
    position:fixed; left:12px; top:12px; z-index:4;
    padding:9px 11px; border:1px solid rgba(255,255,255,.12);
    border-radius:8px; background:rgba(7,10,13,.78); color:#dce8ef;
    font-size:12px; line-height:1.55; pointer-events:none;
    backdrop-filter:blur(4px);
  }
  #status {
    position:fixed; right:12px; top:12px; z-index:5;
    min-width:190px; padding:8px 10px;
    border:1px solid rgba(255,255,255,.12); border-radius:8px;
    background:rgba(7,10,13,.80); color:#eaf2f7; font-size:12px;
  }
  #status strong { color:#fff; }
  #fullscreenBtn {
    position:fixed; right:12px; top:82px; z-index:5;
    border:1px solid rgba(255,255,255,.15); border-radius:8px;
    padding:7px 10px; background:rgba(7,10,13,.80); color:white;
    cursor:pointer; font-weight:700;
  }
  #lobby {
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,11,14,.88);
  }
  #lobby.hidden { display:none; }
  .card {
    width:min(560px,calc(100vw - 28px));
    padding:24px; border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:#151c22; box-shadow:0 18px 70px rgba(0,0,0,.45);
  }
  .card h1 { margin:0 0 8px; font-size:24px; }
  .card p { margin:8px 0; color:#b9c5cd; font-size:14px; line-height:1.55; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  button {
    border:1px solid rgba(255,255,255,.16); border-radius:8px;
    padding:10px 14px; background:#2a4559; color:white; font-weight:750;
    cursor:pointer;
  }
  button.secondary { background:#252c31; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #inviteWrap { display:none; margin-top:16px; }
  #inviteWrap.show { display:block; }
  #invite {
    width:100%; padding:10px 11px; border-radius:8px;
    border:1px solid rgba(255,255,255,.14);
    background:#0e1418; color:#dff4ff; font:12px ui-monospace,Consolas,monospace;
    outline:none;
  }
  #lobbyMsg { color:#a9d9ff; font-weight:700; }
  #pauseBanner {
    position:fixed; z-index:12; left:50%; top:82px; transform:translateX(-50%);
    display:none; padding:8px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.16); background:rgba(20,24,28,.9);
    color:#fff; font-size:13px; font-weight:800;
  }
  #pauseBanner.show { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="help">
  <b>조작</b><br>
  좌클릭 / 드래그: 선택<br>
  우클릭: 절대이동 · 공격 불가<br>
  Ctrl + 우클릭: 이동 경로 추가<br>
  A → 좌클릭: 공격이동<br>
  일꾼으로 아군 자원 우클릭: 채집<br>
  화면 가장자리: 카메라 이동
</div>

<div id="status">네트워크: <strong id="netText">대기</strong><br>진영: <span id="teamText">-</span></div>
<button id="fullscreenBtn">전체화면</button>
<div id="pauseBanner">호스트 창 비활성화 · 게임 일시정지</div>

<div id="lobby">
  <div class="card">
    <h1>Mini Link RTS</h1>
    <p>호스트가 초대 링크를 만들고, 게스트가 링크를 열면 바로 연결됩니다. 게임 판정과 시뮬레이션은 호스트가 담당합니다.</p>
    <p id="lobbyMsg">방식을 선택하세요.</p>
    <div class="row" id="startButtons">
      <button id="hostBtn">호스트 방 만들기</button>
      <button id="soloBtn" class="secondary">혼자 테스트</button>
    </div>
    <div id="inviteWrap">
      <p>아래 링크를 상대에게 보내세요.</p>
      <input id="invite" readonly>
      <div class="row">
        <button id="copyBtn">링크 복사</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* =========================
   기본 상수 / 맵
========================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const lobby = document.getElementById("lobby");
const lobbyMsg = document.getElementById("lobbyMsg");
const hostBtn = document.getElementById("hostBtn");
const soloBtn = document.getElementById("soloBtn");
const inviteWrap = document.getElementById("inviteWrap");
const invite = document.getElementById("invite");
const copyBtn = document.getElementById("copyBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const netText = document.getElementById("netText");
const teamText = document.getElementById("teamText");
const pauseBanner = document.getElementById("pauseBanner");

document.addEventListener("contextmenu", e => e.preventDefault());
fullscreenBtn.onclick = async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (_) {}
};

const TILE = 64;
const MAP_W = 36;
const MAP_H = 24;
const WORLD_W = MAP_W * TILE;
const WORLD_H = MAP_H * TILE;

const GROUND = 0, HILL = 1, RAMP = 2, WALL = 3;
const TEAM_LEFT = 0, TEAM_RIGHT = 1;
const POP_CAP = 50;
const COUNTER_MULT = 1.85;
const HILL_DAMAGE_MULT = 0.70;

const terrain = Array.from({length:MAP_H}, () => Array(MAP_W).fill(GROUND));
function setRect(x0,y0,w,h,t){
  for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++)
    if(x>=0&&y>=0&&x<MAP_W&&y<MAP_H) terrain[y][x]=t;
}
function setTile(x,y,t){ if(x>=0&&y>=0&&x<MAP_W&&y<MAP_H) terrain[y][x]=t; }
function mirrorX(x){ return MAP_W-1-x; }

function addMirroredHill(x0,y0,w,h,rampY){
  const rx0=MAP_W-x0-w;
  setRect(x0,y0,w,h,HILL);
  setRect(rx0,y0,w,h,HILL);
  setTile(x0,rampY,RAMP); setTile(x0+1,rampY,RAMP);
  setTile(rx0+w-1,rampY,RAMP); setTile(rx0+w-2,rampY,RAMP);
}
addMirroredHill(8,4,5,5,7);
addMirroredHill(8,15,5,5,16);

for(let y=9;y<=14;y++){
  if(y!==11&&y!==12){ setTile(15,y,WALL); setTile(20,y,WALL); }
}
for(let x=16;x<=19;x++){
  if(x!==17&&x!==18){ setTile(x,6,WALL); setTile(x,17,WALL); }
}
for(let y=8;y<=10;y++){ setTile(5,y,WALL); setTile(mirrorX(5),y,WALL); }
for(let y=13;y<=15;y++){ setTile(5,y,WALL); setTile(mirrorX(5),y,WALL); }

/* =========================
   유닛 밸런스
   상성: 보병 > 돌격병 > 장갑차 > 저격수 > 보병
========================= */
const UNIT_TYPES = {
  worker: {
    name:"일꾼", hp:65, speed:88, range:52, damage:3, reload:1.0,
    vision:320, cost:20, build:3.5, radius:12,
    special:"정비: 명령이 없을 때 가까운 아군 장갑차/사령부를 자동 수리"
  },
  infantry: {
    name:"보병", hp:125, speed:86, range:125, damage:11.5, reload:0.60,
    vision:320, cost:35, build:4.5, radius:13,
    special:"제압사격: 4번째 공격이 50% 추가 피해"
  },
  sniper: {
    name:"저격수", hp:70, speed:72, range:270, damage:36, reload:1.80,
    vision:480, cost:50, build:7.0, radius:12,
    special:"정밀사격: 사거리/시야 1.5배, 3초간 발사하지 않으면 다음 탄 35% 추가 피해"
  },
  armored: {
    name:"장갑차", hp:260, speed:62, range:160, damage:24, reload:1.15,
    vision:320, cost:60, build:9.0, radius:18,
    special:"고폭탄: 명중 지점 주변 55 범위에 45% 스플래시 피해"
  },
  assault: {
    name:"돌격병", hp:140, speed:108, range:76, damage:13, reload:0.55,
    vision:320, cost:40, build:5.0, radius:14,
    special:"근접돌격: 55 거리 이내에서는 공격속도 20% 증가"
  }
};

const advantage = {
  infantry:"assault",
  assault:"armored",
  armored:"sniper",
  sniper:"infantry"
};

let nextId=1;
let units=[], buildings=[], resourceNodes=[], projectiles=[], floatingTexts=[];
let teamResources=[50,50];
let gameOver=false, winnerTeam=null, gamePaused=false;
let started=false;

/* =========================
   엔티티
========================= */
function makeUnit(type,team,x,y){
  const s=UNIT_TYPES[type];
  const u={
    id:nextId++, kind:"unit", type, team, x,y, renderX:x, renderY:y,
    hp:s.hp,maxHp:s.hp,radius:s.radius, orders:[], cooldown:0,
    carry:0,gatherPhase:"toNode",gatherTargetId:null,gatherTick:0,
    shotCount:0,lastFireAt:-999,lastRepairAt:0
  };
  units.push(u); return u;
}
function makeHQ(team,x,y){
  const b={
    id:nextId++,kind:"building",type:"hq",name:"사령부",team,x,y,renderX:x,renderY:y,
    hp:1200,maxHp:1200,radius:42,vision:320,queue:[]
  };
  buildings.push(b); return b;
}
function makeResource(team,x,y){
  const r={id:nextId++,kind:"resource",team,x,y,radius:26,amount:999999};
  resourceNodes.push(r); return r;
}

let hqByTeam=[null,null], nodeByTeam=[null,null];

function resetWorld(){
  nextId=1; units=[]; buildings=[]; resourceNodes=[]; projectiles=[]; floatingTexts=[];
  teamResources=[50,50]; gameOver=false; winnerTeam=null; gamePaused=false;

  hqByTeam[0]=makeHQ(0,3.2*TILE,12*TILE);
  hqByTeam[1]=makeHQ(1,(MAP_W-3.2)*TILE,12*TILE);

  nodeByTeam[0]=makeResource(0,2.2*TILE,9.7*TILE);
  nodeByTeam[1]=makeResource(1,(MAP_W-2.2)*TILE,9.7*TILE);

  const w00=makeUnit("worker",0,3.0*TILE,10.6*TILE);
  const w01=makeUnit("worker",0,3.8*TILE,10.1*TILE);
  const w10=makeUnit("worker",1,(MAP_W-3.0)*TILE,10.6*TILE);
  const w11=makeUnit("worker",1,(MAP_W-3.8)*TILE,10.1*TILE);

  startGather(w00,nodeByTeam[0]); startGather(w01,nodeByTeam[0]);
  startGather(w10,nodeByTeam[1]); startGather(w11,nodeByTeam[1]);
}
resetWorld();

/* =========================
   네트워크
========================= */
let role="menu";      // menu | host | guest | solo
let localTeam=TEAM_LEFT;
let peer=null, conn=null;
let connected=false;
let lastSnapshotSent=0;
let connectionLost=false;

function setPauseNotice(paused,text="호스트 창 비활성화 · 게임 일시정지"){
  gamePaused=paused;
  pauseBanner.textContent=text;
  pauseBanner.classList.toggle("show",paused);
}

function shouldWarnBeforeExit(){
  return (role==="host"||role==="guest") && (started||connected);
}

addEventListener("beforeunload",e=>{
  if(!shouldWarnBeforeExit()) return;
  e.preventDefault();
  e.returnValue=true;
});

const params=new URLSearchParams(location.search);
const joinId=params.get("join");

function setLobbyMessage(t){ lobbyMsg.textContent=t; }

function makeInvite(peerId){
  const u=new URL(location.href);
  u.search="";
  u.hash="";
  u.searchParams.set("join",peerId);
  return u.toString();
}

function startHost(){
  role="host"; localTeam=TEAM_LEFT; teamText.textContent="왼쪽 / 호스트";
  hostBtn.disabled=true; soloBtn.disabled=true;
  setLobbyMessage("P2P 방을 만드는 중...");
  netText.textContent="호스트 생성 중";

  peer=new Peer();
  peer.on("open",id=>{
    invite.value=makeInvite(id);
    inviteWrap.classList.add("show");
    setLobbyMessage("초대 링크를 상대에게 보내세요. 게스트 접속을 기다리는 중...");
    netText.textContent="게스트 대기";
  });
  peer.on("connection",c=>{
    // 새로고침한 게스트가 이전 연결의 close 이벤트보다 먼저 들어올 수 있다.
    // 최신 연결을 채택하고 이전 연결은 닫아 현재 게임 상태를 그대로 이어 준다.
    const previous=conn;
    conn=c;
    wireHostConnection(c);
    if(previous && previous!==c) try{ previous.close(); }catch(_){}
  });
  peer.on("error",err=>{
    setLobbyMessage("P2P 오류: "+err.type);
    netText.textContent="연결 오류";
  });
}
function wireHostConnection(c){
  c.on("open",()=>{
    if(conn!==c){ c.close(); return; }
    connected=true; connectionLost=false;
    const firstConnection=!started;
    if(firstConnection) resetWorld();
    started=true;
    lobby.classList.add("hidden");
    netText.textContent="연결됨";
    setPauseNotice(document.hidden||!document.hasFocus());
    sendHost({t:"hello",team:TEAM_RIGHT});
    sendHost({t:"pause",paused:gamePaused});
    sendSnapshot(true);
    if(firstConnection) centerCameraForTeam(localTeam);
  });
  c.on("data",msg=>{ if(conn===c) handleGuestMessage(msg); });
  c.on("close",()=>{
    if(conn!==c) return;
    connected=false; connectionLost=true;
    netText.textContent="연결 끊김";
    pauseBanner.textContent="게스트와 연결이 끊겼습니다 · 재접속을 기다리는 중";
    pauseBanner.classList.add("show");
  });
  c.on("error",()=>{ if(conn===c) netText.textContent="연결 오류"; });
}
function sendHost(obj){
  if(conn && conn.open) try{ conn.send(obj); }catch(_){}
}

function startGuest(hostId){
  role="guest"; localTeam=TEAM_RIGHT; teamText.textContent="오른쪽 / 게스트";
  hostBtn.style.display="none"; soloBtn.style.display="none";
  setLobbyMessage("호스트에 연결 중...");
  netText.textContent="호스트 연결 중";

  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect(hostId,{reliable:true,serialization:"json"});
    conn.on("open",()=>{
      connected=true; connectionLost=false;
      setLobbyMessage("연결 완료. 호스트 상태를 기다리는 중...");
      netText.textContent="연결됨";
      pauseBanner.classList.remove("show");
    });
    conn.on("data",msg=>handleHostMessage(msg));
    conn.on("close",()=>{
      connected=false; connectionLost=true;
      netText.textContent="연결 끊김";
      pauseBanner.textContent="호스트와 연결이 끊겼습니다";
      pauseBanner.classList.add("show");
    });
    conn.on("error",()=>{
      netText.textContent="연결 오류";
      setLobbyMessage("호스트 연결에 실패했습니다.");
    });
  });
  peer.on("error",err=>{
    netText.textContent="연결 오류";
    setLobbyMessage("P2P 오류: "+err.type);
  });
}
function sendGuest(obj){
  if(conn && conn.open) try{ conn.send(obj); }catch(_){}
}

function startSolo(){
  role="solo"; localTeam=TEAM_LEFT; connected=true; started=true;
  resetWorld();
  lobby.classList.add("hidden");
  netText.textContent="싱글 테스트";
  teamText.textContent="왼쪽 / 테스트";
  centerCameraForTeam(localTeam);
}

copyBtn.onclick=async()=>{
  try{
    await navigator.clipboard.writeText(invite.value);
    copyBtn.textContent="복사됨";
    setTimeout(()=>copyBtn.textContent="링크 복사",1200);
  }catch(_){
    invite.select(); document.execCommand("copy");
  }
};
hostBtn.onclick=startHost;
soloBtn.onclick=startSolo;
if(joinId) startGuest(joinId);

function exportState(){
  return {
    t:"state",
    units:units.filter(u=>u.hp>0).map(u=>({
      id:u.id,type:u.type,team:u.team,x:u.x,y:u.y,hp:u.hp,maxHp:u.maxHp,radius:u.radius,
      orders:u.orders.map(o=>({type:o.type,x:o.x,y:o.y,targetId:o.targetId||null})),
      carry:u.carry,gatherPhase:u.gatherPhase
    })),
    buildings:buildings.filter(b=>b.hp>0).map(b=>({
      id:b.id,type:b.type,name:b.name,team:b.team,x:b.x,y:b.y,hp:b.hp,maxHp:b.maxHp,radius:b.radius,vision:b.vision,
      queue:b.queue.map(q=>({type:q.type,time:q.time,max:q.max}))
    })),
    resourceNodes:resourceNodes.map(r=>({id:r.id,team:r.team,x:r.x,y:r.y,radius:r.radius})),
    teamResources:[teamResources[0],teamResources[1]],
    gameOver,winnerTeam,paused:gamePaused,serverNow:performance.now()
  };
}
function sendSnapshot(force=false){
  if(role!=="host" || !connected) return;
  const now=performance.now();
  if(!force && now-lastSnapshotSent<80) return; // 약 12.5Hz
  lastSnapshotSent=now;
  sendHost(exportState());
}
function syncArrayInPlace(current,incoming,kind){
  const byId=new Map(current.map(e=>[e.id,e]));
  const next=[];
  for(const raw of incoming){
    let e=byId.get(raw.id);
    if(!e){
      e={...raw,kind,renderX:raw.x,renderY:raw.y};
    }else{
      const rx=e.renderX ?? e.x, ry=e.renderY ?? e.y;
      Object.assign(e,raw);
      e.kind=kind; e.renderX=rx; e.renderY=ry;
    }
    next.push(e);
  }
  return next;
}
function handleHostMessage(msg){
  if(!msg||typeof msg!=="object") return;
  if(msg.t==="hello"){
    localTeam=msg.team;
    teamText.textContent="오른쪽 / 게스트";
  }else if(msg.t==="pause"){
    setPauseNotice(!!msg.paused,"호스트가 다른 창을 보고 있어 게임이 일시정지되었습니다");
  }else if(msg.t==="state"){
    const first=!started;
    units=syncArrayInPlace(units,msg.units||[],"unit");
    buildings=syncArrayInPlace(buildings,msg.buildings||[],"building");
    resourceNodes=syncArrayInPlace(resourceNodes,msg.resourceNodes||[],"resource");
    hqByTeam[0]=buildings.find(b=>b.team===0&&b.type==="hq")||null;
    hqByTeam[1]=buildings.find(b=>b.team===1&&b.type==="hq")||null;
    nodeByTeam[0]=resourceNodes.find(r=>r.team===0)||null;
    nodeByTeam[1]=resourceNodes.find(r=>r.team===1)||null;
    teamResources=msg.teamResources||teamResources;
    gameOver=!!msg.gameOver;
    winnerTeam=msg.winnerTeam;
    setPauseNotice(!!msg.paused,"호스트가 다른 창을 보고 있어 게임이 일시정지되었습니다");
    started=true;
    lobby.classList.add("hidden");
    if(first) centerCameraForTeam(localTeam);
  }
}
function handleGuestMessage(msg){
  if(role!=="host"||!msg||typeof msg!=="object") return;
  if(msg.t!=="cmd") return;
  applyCommand(TEAM_RIGHT,msg.cmd);
}

function sendOrApplyCommand(cmd){
  if(role==="guest") sendGuest({t:"cmd",cmd});
  else applyCommand(localTeam,cmd);
}

/* =========================
   명령 검증/적용
========================= */
function getEntity(id){
  return units.find(u=>u.id===id&&u.hp>0) || buildings.find(b=>b.id===id&&b.hp>0) || null;
}
function getResourceNode(id){ return resourceNodes.find(r=>r.id===id)||null; }

function unitsForIds(team,ids){
  const set=new Set(ids||[]);
  return units.filter(u=>u.hp>0&&u.team===team&&set.has(u.id));
}

function applyCommand(team,cmd){
  if(!cmd||gameOver) return;
  if(cmd.type==="move" || cmd.type==="attackMove"){
    const us=unitsForIds(team,cmd.ids);
    const x=Math.max(8,Math.min(WORLD_W-8,Number(cmd.x)||0));
    const y=Math.max(8,Math.min(WORLD_H-8,Number(cmd.y)||0));
    for(const u of us){
      const order={type:cmd.type,x,y};
      if(cmd.queue) u.orders.push(order); else u.orders=[order];
    }
  }else if(cmd.type==="gather"){
    const node=getResourceNode(cmd.nodeId);
    if(!node||node.team!==team) return;
    for(const u of unitsForIds(team,cmd.ids)){
      if(u.type==="worker") startGather(u,node);
    }
  }else if(cmd.type==="produce"){
    const hq=hqByTeam[team];
    if(hq) queueUnit(hq,cmd.unitType,team);
  }
}

/* =========================
   이동 / 시야 / 전투
========================= */
function tileAtWorld(x,y){
  const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return WALL;
  return terrain[ty][tx];
}
function canStep(ox,oy,nx,ny){
  if(nx<8||ny<8||nx>=WORLD_W-8||ny>=WORLD_H-8) return false;
  const a=tileAtWorld(ox,oy),b=tileAtWorld(nx,ny);
  if(b===WALL) return false;
  if((a===GROUND&&b===HILL)||(a===HILL&&b===GROUND)) return false;
  return true;
}
function hasLineOfSight(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),steps=Math.ceil(len/18);
  for(let i=1;i<steps;i++){
    const x=ax+dx*(i/steps),y=ay+dy*(i/steps);
    if(tileAtWorld(x,y)===WALL) return false;
  }
  return true;
}
function visionSources(team){
  const arr=[];
  for(const u of units) if(u.team===team&&u.hp>0) arr.push({x:u.x,y:u.y,vision:UNIT_TYPES[u.type].vision});
  for(const b of buildings) if(b.team===team&&b.hp>0) arr.push({x:b.x,y:b.y,vision:b.vision});
  return arr;
}
function pointVisibleTo(team,x,y){
  for(const s of visionSources(team)){
    if(Math.hypot(x-s.x,y-s.y)<=s.vision && hasLineOfSight(s.x,s.y,x,y)) return true;
  }
  return false;
}
function entityVisibleTo(team,e){ return e.team===team || pointVisibleTo(team,e.x,e.y); }

function startGather(u,node){
  u.orders=[{type:"gather",targetId:node.id}];
  u.gatherTargetId=node.id; u.gatherPhase="toNode"; u.gatherTick=0;
}
function moveToward(u,tx,ty,dt){
  const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);
  if(d<2) return true;
  const step=Math.min(d,UNIT_TYPES[u.type].speed*dt);
  const nx=u.x+dx/d*step,ny=u.y+dy/d*step;
  if(canStep(u.x,u.y,nx,ny)){u.x=nx;u.y=ny;}
  else return false; // 길찾기 없음
  return d<=UNIT_TYPES[u.type].speed*dt+2;
}
function nearestAttackable(u,maxRange){
  let best=null,bd=Infinity;
  for(const e of [...units,...buildings]){
    if(e.hp<=0||e.team===u.team) continue;
    const d=Math.hypot(e.x-u.x,e.y-u.y)-e.radius;
    if(d<=maxRange&&d<bd&&hasLineOfSight(u.x,u.y,e.x,e.y)&&pointVisibleTo(u.team,e.x,e.y)){
      best=e;bd=d;
    }
  }
  return best;
}
function counterMult(attacker,target){
  return attacker.kind==="unit"&&target.kind==="unit"&&advantage[attacker.type]===target.type ? COUNTER_MULT : 1;
}
function finalDamage(attacker,target,base){
  let d=base*counterMult(attacker,target);
  if(tileAtWorld(target.x,target.y)===HILL) d*=HILL_DAMAGE_MULT;
  return d;
}
function addDamageText(target,amount,label=""){
  floatingTexts.push({x:target.x,y:target.y-20,text:(label?label+" ":"")+"-"+Math.round(amount),life:.7});
}
function applyDamage(attacker,target,base,label=""){
  if(!target||target.hp<=0) return 0;
  const d=finalDamage(attacker,target,base);
  target.hp-=d;
  addDamageText(target,d,label);
  return d;
}
function fireAt(u,target,nowSec){
  const s=UNIT_TYPES[u.type];
  if(u.cooldown>0) return;

  let reload=s.reload;
  let base=s.damage;
  let label="";

  if(u.type==="infantry"){
    u.shotCount=(u.shotCount||0)+1;
    if(u.shotCount%4===0){ base*=1.5; label="제압"; }
  }
  if(u.type==="sniper" && nowSec-(u.lastFireAt||-999)>=3){
    base*=1.35; label="정밀";
  }
  if(u.type==="assault"){
    const d=Math.hypot(target.x-u.x,target.y-u.y)-target.radius;
    if(d<=55) reload*=0.80;
  }

  u.cooldown=reload;
  u.lastFireAt=nowSec;

  projectiles.push({
    x:u.x,y:u.y,targetId:target.id,team:u.team,speed:760,life:1.2,
    baseDamage:base,attackerId:u.id,fromType:u.type,label
  });
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.life-=dt;
    const target=getEntity(p.targetId),attacker=getEntity(p.attackerId);
    if(!target||!attacker||p.life<=0){projectiles.splice(i,1);continue;}
    const dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy),st=p.speed*dt;
    if(d<=st+target.radius){
      applyDamage(attacker,target,p.baseDamage,p.label);

      if(p.fromType==="armored"){
        for(const e of [...units,...buildings]){
          if(e.hp<=0||e.team===attacker.team||e.id===target.id) continue;
          if(Math.hypot(e.x-target.x,e.y-target.y)<=55+e.radius){
            applyDamage(attacker,e,p.baseDamage*0.45,"폭발");
          }
        }
      }
      projectiles.splice(i,1);
    }else{
      p.x+=dx/d*st; p.y+=dy/d*st;
    }
  }
}
function updateGather(u,o,dt){
  const node=getResourceNode(o.targetId);
  const hq=hqByTeam[u.team];
  if(!node||!hq||hq.hp<=0) return;
  if(u.gatherPhase==="toNode"){
    if(moveToward(u,node.x,node.y,dt)||Math.hypot(u.x-node.x,u.y-node.y)<node.radius+12){
      u.gatherPhase="mining";u.gatherTick=0;
    }
  }else if(u.gatherPhase==="mining"){
    u.gatherTick+=dt;
    if(u.gatherTick>=.25){
      const ticks=Math.floor(u.gatherTick/.25);
      u.gatherTick-=ticks*.25;
      // 기존 버전의 정확히 1/10: 2.5/tick -> 0.25/tick, 운반량 50 -> 5
      u.carry=Math.min(5,u.carry+ticks*.25);
      if(u.carry>=5) u.gatherPhase="toHQ";
    }
  }else if(u.gatherPhase==="toHQ"){
    if(moveToward(u,hq.x,hq.y,dt)||Math.hypot(u.x-hq.x,u.y-hq.y)<hq.radius+18){
      teamResources[u.team]+=u.carry;
      u.carry=0;u.gatherPhase="toNode";
    }
  }
}
function autoRepair(u,dt){
  if(u.type!=="worker"||u.orders.length) return;
  let best=null,bd=90;
  for(const e of [...units,...buildings]){
    if(e.team!==u.team||e.hp<=0||e.hp>=e.maxHp) continue;
    if(e.kind==="unit"&&e.type!=="armored") continue;
    const d=Math.hypot(e.x-u.x,e.y-u.y)-e.radius;
    if(d<bd){best=e;bd=d;}
  }
  if(best){
    best.hp=Math.min(best.maxHp,best.hp+3*dt);
  }
}
function updateUnits(dt,nowSec){
  for(const u of units){
    if(u.hp<=0) continue;
    u.cooldown=Math.max(0,u.cooldown-dt);
    const o=u.orders[0];

    if(o?.type==="gather"&&u.type==="worker"){ updateGather(u,o,dt); continue; }
    if(o?.type==="move"){
      if(moveToward(u,o.x,o.y,dt)) u.orders.shift();
      continue; // 절대이동 중 공격 불가
    }
    if(o?.type==="attackMove"){
      const t=nearestAttackable(u,UNIT_TYPES[u.type].range);
      if(t) fireAt(u,t,nowSec);
      else if(moveToward(u,o.x,o.y,dt)) u.orders.shift();
      continue;
    }
    if(!o){
      if(u.type==="worker") autoRepair(u,dt);
      else{
        const t=nearestAttackable(u,UNIT_TYPES[u.type].range);
        if(t) fireAt(u,t,nowSec);
      }
    }
  }

  for(let i=0;i<units.length;i++){
    const a=units[i]; if(a.hp<=0)continue;
    for(let j=i+1;j<units.length;j++){
      const b=units[j]; if(b.hp<=0||a.team!==b.team)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),minD=(a.radius+b.radius)*.75;
      if(d>0&&d<minD){
        const push=(minD-d)*.16,nx=dx/d,ny=dy/d;
        if(canStep(a.x,a.y,a.x-nx*push,a.y-ny*push)){a.x-=nx*push;a.y-=ny*push;}
        if(canStep(b.x,b.y,b.x+nx*push,b.y+ny*push)){b.x+=nx*push;b.y+=ny*push;}
      }
    }
  }
}
function currentPop(team){
  return units.filter(u=>u.team===team&&u.hp>0).length;
}
function queuedPop(team){
  const hq=hqByTeam[team];
  return hq ? hq.queue.length : 0;
}
function queueUnit(hq,type,team){
  const s=UNIT_TYPES[type];
  if(!s||!hq||hq.hp<=0) return false;
  if(currentPop(team)+queuedPop(team)>=POP_CAP) return false;
  if(teamResources[team]<s.cost) return false;
  teamResources[team]-=s.cost;
  hq.queue.push({type,time:s.build,max:s.build});
  return true;
}
function spawnNearHQ(hq,type){
  const dir=hq.team===TEAM_LEFT?1:-1;
  const baseX=hq.x+dir*72;
  for(let k=0;k<14;k++){
    const a=k/14*Math.PI*2;
    const x=baseX+Math.cos(a)*32,y=hq.y+Math.sin(a)*64;
    if(tileAtWorld(x,y)!==WALL) return makeUnit(type,hq.team,x,y);
  }
  return makeUnit(type,hq.team,baseX,hq.y);
}
function updateBuildings(dt){
  for(const hq of hqByTeam){
    if(!hq||hq.hp<=0||!hq.queue.length) continue;
    const q=hq.queue[0];q.time-=dt;
    if(q.time<=0){spawnNearHQ(hq,q.type);hq.queue.shift();}
  }
}
function removeDead(){
  units=units.filter(u=>u.hp>0);
  for(let i=0;i<hqByTeam.length;i++){
    if(hqByTeam[i]&&hqByTeam[i].hp<=0) hqByTeam[i].hp=0;
  }
}
function checkGameOver(){
  if(gameOver)return;
  if(hqByTeam[0]&&hqByTeam[0].hp<=0){gameOver=true;winnerTeam=1;}
  if(hqByTeam[1]&&hqByTeam[1].hp<=0){gameOver=true;winnerTeam=0;}
}

/* 간단 싱글 테스트 AI */
let aiBuildTimer=0,aiWaveTimer=0;
function updateSoloAI(dt){
  if(role!=="solo"||gameOver)return;
  aiBuildTimer+=dt;aiWaveTimer+=dt;
  const team=1,hq=hqByTeam[team];
  if(!hq||hq.hp<=0)return;

  if(aiBuildTimer>2.0){
    aiBuildTimer=0;
    const order=["infantry","assault","sniper","armored"];
    const counts=Object.fromEntries(order.map(t=>[t,units.filter(u=>u.team===team&&u.type===t).length]));
    order.sort((a,b)=>counts[a]-counts[b]);
    queueUnit(hq,order[0],team);
  }
  if(aiWaveTimer>10){
    aiWaveTimer=0;
    const army=units.filter(u=>u.team===1&&u.type!=="worker");
    if(army.length>=3){
      for(const u of army){
        u.orders=[
          {type:"attackMove",x:26*TILE,y:12*TILE},
          {type:"attackMove",x:18*TILE,y:12*TILE},
          {type:"attackMove",x:10*TILE,y:12*TILE},
          {type:"attackMove",x:hqByTeam[0].x,y:hqByTeam[0].y}
        ];
      }
    }
  }
}

   입력 / 선택 / 카메라
========================= */
const camera={x:0,y:0,speed:680};
const mouse={x:0,y:0,worldX:0,worldY:0,down:false,startX:0,startY:0,drag:false};
let selectedIds=[];
let attackMoveMode=false;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);
  canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  clampCamera();
}
addEventListener("resize",resize);resize();

function clampCamera(){
  camera.x=Math.max(0,Math.min(camera.x,Math.max(0,WORLD_W-innerWidth)));
  camera.y=Math.max(0,Math.min(camera.y,Math.max(0,WORLD_H-innerHeight)));
}
function centerCameraForTeam(team){
  const hq=hqByTeam[team];
  if(!hq)return;
  camera.x=hq.x-innerWidth*(team===0?.35:.65);
  camera.y=hq.y-innerHeight*.5;
  clampCamera();
}
function worldToScreen(x,y){return{x:x-camera.x,y:y-camera.y};}
function screenToWorld(x,y){return{x:x+camera.x,y:y+camera.y};}
function selectedEntities(){
  const set=new Set(selectedIds);
  return [...units,...buildings].filter(e=>set.has(e.id)&&e.hp>0);
}
function clearSelection(){selectedIds=[];}
function entityAtWorld(x,y,team){
  let best=null,bd=Infinity;
  for(const e of [...units,...buildings]){
    if(e.hp<=0||e.team!==team)continue;
    const d=Math.hypot(x-e.x,y-e.y);
    if(d<=e.radius+8&&d<bd){best=e;bd=d;}
  }
  return best;
}
function resourceAtWorld(x,y,team){
  return resourceNodes.find(r=>r.team===team&&Math.hypot(x-r.x,y-r.y)<=r.radius+12)||null;
}

canvas.addEventListener("mousemove",e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;
  const w=screenToWorld(mouse.x,mouse.y);mouse.worldX=w.x;mouse.worldY=w.y;
  if(mouse.down&&Math.hypot(mouse.x-mouse.startX,mouse.y-mouse.startY)>5)mouse.drag=true;
});
canvas.addEventListener("mousedown",e=>{
  if(!started||gameOver||gamePaused)return;
  if(e.button===0){
    mouse.down=true;mouse.startX=e.clientX;mouse.startY=e.clientY;mouse.drag=false;
  }
});
canvas.addEventListener("mouseup",e=>{
  if(!started||gameOver||gamePaused)return;
  const w=screenToWorld(e.clientX,e.clientY);

  if(e.button===0&&mouse.down){
    mouse.down=false;
    if(handleBottomUI(e.clientX,e.clientY)){mouse.drag=false;return;}

    if(attackMoveMode){
      const ids=selectedEntities().filter(s=>s.kind==="unit"&&s.team===localTeam).map(s=>s.id);
      if(ids.length) sendOrApplyCommand({type:"attackMove",ids,x:w.x,y:w.y,queue:false});
      attackMoveMode=false;mouse.drag=false;return;
    }

    if(mouse.drag){
      const x1=Math.min(mouse.startX,e.clientX)+camera.x,y1=Math.min(mouse.startY,e.clientY)+camera.y;
      const x2=Math.max(mouse.startX,e.clientX)+camera.x,y2=Math.max(mouse.startY,e.clientY)+camera.y;
      selectedIds=units.filter(u=>u.team===localTeam&&u.x>=x1&&u.x<=x2&&u.y>=y1&&u.y<=y2).map(u=>u.id);
    }else{
      const hit=entityAtWorld(w.x,w.y,localTeam);
      if(hit){
        if(e.shiftKey){
          if(!selectedIds.includes(hit.id))selectedIds.push(hit.id);
        }else selectedIds=[hit.id];
      }else if(!e.shiftKey)clearSelection();
    }
    mouse.drag=false;
  }

  if(e.button===2){
    const us=selectedEntities().filter(s=>s.kind==="unit"&&s.team===localTeam);
    if(!us.length)return;
    const node=resourceAtWorld(w.x,w.y,localTeam);
    const workers=us.filter(u=>u.type==="worker");
    if(node&&workers.length){
      sendOrApplyCommand({type:"gather",ids:workers.map(u=>u.id),nodeId:node.id});
      return;
    }
    sendOrApplyCommand({type:"move",ids:us.map(u=>u.id),x:w.x,y:w.y,queue:e.ctrlKey});
  }
});
addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="a"&&selectedEntities().some(s=>s.kind==="unit"&&s.team===localTeam))attackMoveMode=true;
  if(e.key==="Escape")attackMoveMode=false;
});

function updateCamera(dt){
  if(!started)return;
  const edge=18;
  if(mouse.x<=edge)camera.x-=camera.speed*dt;
  if(mouse.x>=innerWidth-edge)camera.x+=camera.speed*dt;
  if(mouse.y<=edge)camera.y-=camera.speed*dt;
  if(mouse.y>=innerHeight-edge)camera.y+=camera.speed*dt;
  clampCamera();
}

/* 호스트 창이 백그라운드면 일시정지 상태를 별도 메시지로 즉시 알린다. */
function updateHostWindowPause(){
  if(role!=="host"||!started) return;
  const paused=document.hidden||!document.hasFocus();
  setPauseNotice(paused);
  sendHost({t:"pause",paused});
  sendSnapshot(true);
}
document.addEventListener("visibilitychange",updateHostWindowPause);
addEventListener("blur",updateHostWindowPause);
addEventListener("focus",updateHostWindowPause);

/* =========================
   렌더링
========================= */
function drawTerrain(){
  const sx0=Math.max(0,Math.floor(camera.x/TILE)),sy0=Math.max(0,Math.floor(camera.y/TILE));
  const sx1=Math.min(MAP_W-1,Math.ceil((camera.x+innerWidth)/TILE));
  const sy1=Math.min(MAP_H-1,Math.ceil((camera.y+innerHeight)/TILE));
  for(let y=sy0;y<=sy1;y++)for(let x=sx0;x<=sx1;x++){
    const t=terrain[y][x],sx=x*TILE-camera.x,sy=y*TILE-camera.y;
    ctx.fillStyle=t===GROUND?"#557a4a":t===HILL?"#82744f":t===RAMP?"#9a875b":"#2d3237";
    ctx.fillRect(sx,sy,TILE,TILE);
    ctx.strokeStyle="rgba(0,0,0,.10)";ctx.strokeRect(sx+.5,sy+.5,TILE,TILE);
    if(t===HILL){ctx.fillStyle="rgba(255,255,255,.08)";ctx.fillRect(sx+4,sy+4,TILE-8,5);}
    if(t===RAMP){
      ctx.strokeStyle="rgba(255,255,255,.22)";
      for(let k=12;k<TILE;k+=14){ctx.beginPath();ctx.moveTo(sx+8,sy+k);ctx.lineTo(sx+TILE-8,sy+k);ctx.stroke();}
    }
    if(t===WALL){
      ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(sx+7,sy+7,TILE-14,TILE-14);
      ctx.strokeStyle="rgba(255,255,255,.12)";ctx.strokeRect(sx+8.5,sy+8.5,TILE-17,TILE-17);
    }
  }
}
function lerpRenderEntities(dt){
  if(role!=="guest")return;
  const k=1-Math.pow(.001,dt);
  for(const e of [...units,...buildings]){
    e.renderX+=(e.x-e.renderX)*k;
    e.renderY+=(e.y-e.renderY)*k;
  }
}
function displayPos(e){
  if(role==="guest")return{x:e.renderX??e.x,y:e.renderY??e.y};
  return{x:e.x,y:e.y};
}
function drawHealth(e,sx,sy,w){
  const p=Math.max(0,e.hp/e.maxHp);
  ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(sx-w/2,sy-e.radius-15,w,5);
  ctx.fillStyle=e.team===localTeam?"#6ee07c":"#ff6969";ctx.fillRect(sx-w/2,sy-e.radius-15,w*p,5);
}
function drawResource(r){
  const s=worldToScreen(r.x,r.y);
  ctx.save();ctx.translate(s.x,s.y);
  ctx.fillStyle=r.team===localTeam?"#3c9bd6":"#55717f";
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4,rr=i%2?17:26,x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(255,255,255,.45)";ctx.stroke();
  ctx.fillStyle="#eefaff";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillText("자원",0,4);
  ctx.restore();
}
function drawBuilding(b){
  if(b.hp<=0||!entityVisibleTo(localTeam,b))return;
  const p=displayPos(b),s=worldToScreen(p.x,p.y),sel=selectedIds.includes(b.id);
  ctx.save();ctx.translate(s.x,s.y);
  ctx.fillStyle=b.team===localTeam?"#4b8ddb":"#d45353";
  ctx.fillRect(-38,-38,76,76);
  ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(-30,-30,60,16);
  ctx.strokeStyle=sel?"#fff":"rgba(0,0,0,.45)";ctx.lineWidth=sel?3:2;ctx.strokeRect(-40,-40,80,80);
  ctx.fillStyle="#fff";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText("사령부",0,5);
  ctx.restore();
  drawHealth(b,s.x,s.y,76);
  if(b.queue?.length){
    const q=b.queue[0],v=1-q.time/q.max;
    ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(s.x-36,s.y+50,72,6);
    ctx.fillStyle="#f4d35e";ctx.fillRect(s.x-36,s.y+50,72*v,6);
  }
}
function unitColor(u){
  if(u.type==="worker")return u.team===localTeam?"#9fd3ff":"#ff9f9f";
  if(u.type==="sniper")return u.team===localTeam?"#9d86ff":"#d889ff";
  if(u.type==="armored")return u.team===localTeam?"#5f8fb7":"#b75f5f";
  if(u.type==="assault")return u.team===localTeam?"#65d6d0":"#ff9a59";
  return u.team===localTeam?"#78b8ff":"#ff7777";
}
function drawUnit(u){
  if(u.hp<=0||!entityVisibleTo(localTeam,u))return;
  const p=displayPos(u),s=worldToScreen(p.x,p.y),sel=selectedIds.includes(u.id);
  ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle=unitColor(u);
  ctx.strokeStyle=sel?"#fff":"rgba(0,0,0,.55)";ctx.lineWidth=sel?3:2;
  if(u.type==="armored"){
    ctx.fillRect(-18,-14,36,28);ctx.strokeRect(-18,-14,36,28);
    ctx.fillStyle="rgba(20,20,20,.5)";ctx.fillRect(-4,-20,8,17);
  }else if(u.type==="sniper"){
    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(13,11);ctx.lineTo(-13,11);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo(18,-10);ctx.stroke();
  }else if(u.type==="assault"){
    ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.34)";ctx.fillRect(-7,-4,14,8);
  }else if(u.type==="worker"){
    ctx.fillRect(-11,-11,22,22);ctx.strokeRect(-11,-11,22,22);
    ctx.strokeStyle="#222";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-15,-14);ctx.lineTo(14,14);ctx.stroke();
  }else{
    ctx.fillRect(-12,-12,24,24);ctx.strokeRect(-12,-12,24,24);
  }
  ctx.fillStyle="#fff";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText(UNIT_TYPES[u.type].name,0,u.radius+16);
  if(u.type==="worker"&&u.carry>0){ctx.fillStyle="#9ee7ff";ctx.font="bold 9px sans-serif";ctx.fillText(u.carry.toFixed(1),0,-u.radius-18);}
  ctx.restore();drawHealth(u,s.x,s.y,34);

  if(sel&&u.orders?.length){
    let px=s.x,py=s.y;
    for(const o of u.orders){
      if(typeof o.x!=="number")continue;
      const q=worldToScreen(o.x,o.y);
      ctx.strokeStyle=o.type==="attackMove"?"rgba(255,210,70,.8)":"rgba(150,220,255,.65)";
      ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(q.x,q.y);ctx.stroke();
      ctx.beginPath();ctx.arc(q.x,q.y,5,0,Math.PI*2);ctx.stroke();px=q.x;py=q.y;
    }
  }
}
function drawProjectiles(){
  if(role==="guest")return; // 게스트 스냅샷에는 투사체를 생략해 네트워크를 가볍게 유지
  for(const p of projectiles){
    const s=worldToScreen(p.x,p.y);
    ctx.fillStyle=p.team===localTeam?"#d9f0ff":"#ffd2d2";
    ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill();
  }
}
function drawFog(){
  const x0=Math.max(0,Math.floor(camera.x/TILE)),y0=Math.max(0,Math.floor(camera.y/TILE));
  const x1=Math.min(MAP_W-1,Math.ceil((camera.x+innerWidth)/TILE)),y1=Math.min(MAP_H-1,Math.ceil((camera.y+innerHeight)/TILE));
  ctx.fillStyle="rgba(8,12,15,.56)";
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const cx=(x+.5)*TILE,cy=(y+.5)*TILE;
    if(!pointVisibleTo(localTeam,cx,cy))ctx.fillRect(x*TILE-camera.x,y*TILE-camera.y,TILE+1,TILE+1);
  }
}
function drawSelectionBox(){
  if(!mouse.down||!mouse.drag)return;
  const x=Math.min(mouse.startX,mouse.x),y=Math.min(mouse.startY,mouse.y),w=Math.abs(mouse.x-mouse.startX),h=Math.abs(mouse.y-mouse.startY);
  ctx.fillStyle="rgba(90,180,255,.10)";ctx.fillRect(x,y,w,h);
  ctx.strokeStyle="rgba(130,210,255,.9)";ctx.strokeRect(x+.5,y+.5,w,h);
}

const prodButtons=[
  {type:"worker",label:"일꾼"},
  {type:"infantry",label:"보병"},
  {type:"sniper",label:"저격"},
  {type:"armored",label:"장갑차"},
  {type:"assault",label:"돌격병"}
];
function bottomPanelRect(){return{x:innerWidth/2-330,y:innerHeight-118,w:660,h:106};}
function handleBottomUI(mx,my){
  const sel=selectedEntities();
  const hq=hqByTeam[localTeam];
  const selectedHQ=sel.length===1&&hq&&sel[0].id===hq.id;
  if(!selectedHQ)return false;
  const p=bottomPanelRect();
  if(mx<p.x||mx>p.x+p.w||my<p.y||my>p.y+p.h)return false;
  const bx=p.x+18,by=p.y+48,bw=116,bh=42,gap=9;
  for(let i=0;i<prodButtons.length;i++){
    const x=bx+i*(bw+gap);
    if(mx>=x&&mx<=x+bw&&my>=by&&my<=by+bh){
      sendOrApplyCommand({type:"produce",unitType:prodButtons[i].type});
      return true;
    }
  }
  return true;
}
function drawHUD(){
  ctx.save();
  ctx.fillStyle="rgba(8,12,15,.78)";ctx.fillRect(innerWidth/2-160,12,320,60);
  ctx.strokeStyle="rgba(255,255,255,.14)";ctx.strokeRect(innerWidth/2-159.5,12.5,319,59);
  ctx.fillStyle="#dff6ff";ctx.font="bold 18px sans-serif";ctx.textAlign="center";
  ctx.fillText(`자원 ${Math.floor(teamResources[localTeam]||0)}   ·   인구 ${currentPop(localTeam)} / ${POP_CAP}`,innerWidth/2,35);
  ctx.font="12px sans-serif";ctx.fillStyle=attackMoveMode?"#f4d35e":"#becad4";
  ctx.fillText(attackMoveMode?"공격이동 목표를 좌클릭 · Esc 취소":"사령부가 파괴되면 패배",innerWidth/2,57);

  const sel=selectedEntities(),hq=hqByTeam[localTeam];
  if(sel.length===1&&hq&&sel[0].id===hq.id){
    const p=bottomPanelRect();
    ctx.fillStyle="rgba(8,12,15,.90)";ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.strokeStyle="rgba(255,255,255,.18)";ctx.strokeRect(p.x+.5,p.y+.5,p.w-1,p.h-1);
    ctx.textAlign="left";ctx.fillStyle="#fff";ctx.font="bold 13px sans-serif";
    ctx.fillText("사령부 생산",p.x+18,p.y+25);
    ctx.font="11px sans-serif";ctx.fillStyle="#a9bac4";
    ctx.fillText(`대기열 ${hq.queue?.length||0} · 최대 인구 ${POP_CAP}`,p.x+112,p.y+25);

    const bx=p.x+18,by=p.y+48,bw=116,bh=42,gap=9;
    prodButtons.forEach((b,i)=>{
      const s=UNIT_TYPES[b.type],x=bx+i*(bw+gap);
      const can=(teamResources[localTeam]||0)>=s.cost && currentPop(localTeam)+queuedPop(localTeam)<POP_CAP;
      ctx.fillStyle=can?"#273b49":"#25292c";ctx.fillRect(x,by,bw,bh);
      ctx.strokeStyle="rgba(255,255,255,.15)";ctx.strokeRect(x+.5,by+.5,bw-1,bh-1);
      ctx.fillStyle=can?"#fff":"#70777b";ctx.textAlign="center";ctx.font="bold 12px sans-serif";ctx.fillText(b.label,x+bw/2,by+16);
      ctx.font="10px sans-serif";ctx.fillText(`${s.cost}자원 · ${s.build.toFixed(1)}초`,x+bw/2,by+32);
    });
  }

  // 선택 1개면 특수효과 표시
  if(sel.length===1&&sel[0].kind==="unit"){
    const u=sel[0],s=UNIT_TYPES[u.type];
    ctx.fillStyle="rgba(8,12,15,.78)";ctx.fillRect(12,innerHeight-76,430,62);
    ctx.strokeStyle="rgba(255,255,255,.12)";ctx.strokeRect(12.5,innerHeight-75.5,429,61);
    ctx.textAlign="left";ctx.fillStyle="#fff";ctx.font="bold 13px sans-serif";ctx.fillText(`${s.name}  HP ${Math.ceil(u.hp)} / ${u.maxHp}`,24,innerHeight-52);
    ctx.font="11px sans-serif";ctx.fillStyle="#b9c7d0";ctx.fillText(s.special,24,innerHeight-31);
  }

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 44px sans-serif";
    const win=winnerTeam===localTeam;
    ctx.fillText(win?"승리":"패배",innerWidth/2,innerHeight/2-8);
    ctx.font="16px sans-serif";ctx.fillStyle="#d2d8dc";
    ctx.fillText("사령부가 파괴되었습니다.",innerWidth/2,innerHeight/2+30);
  }
  ctx.restore();
}
function updateFloating(dt){
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i];f.life-=dt;f.y-=18*dt;
    if(f.life<=0){floatingTexts.splice(i,1);continue;}
  }
}
function drawFloating(){
  for(const f of floatingTexts){
    const s=worldToScreen(f.x,f.y);
    ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.fillText(f.text,s.x,s.y);
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  drawTerrain();
  for(const r of resourceNodes)drawResource(r);
  for(const b of buildings)drawBuilding(b);
  for(const u of units)drawUnit(u);
  drawProjectiles();
  drawFog();
  drawSelectionBox();
  drawFloating();
  drawHUD();
}

/* =========================
   메인 루프
========================= */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.04);last=now;
  updateCamera(dt);
  lerpRenderEntities(dt);

  const authoritative = role==="host"||role==="solo";
  if(started&&authoritative&&!gameOver&&!gamePaused){
    const nowSec=now/1000;
    updateUnits(dt,nowSec);
    updateBuildings(dt);
    updateProjectiles(dt);
    updateSoloAI(dt);
    removeDead();
    checkGameOver();
  }
  if(authoritative)updateFloating(dt);
  if(role==="host")sendSnapshot(false);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
